version: "3.9"

services:
  db:
    image: postgres:16
    container_name: pasteleria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pasteleria_db
      POSTGRES_USER: pasteleria_user
      POSTGRES_PASSWORD: pasteleria_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
